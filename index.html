<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화법과 언어 · 문법 학습지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#FAF9F5; --paper:#FFFFFF; --ink:#232420; --ink-soft:#5B5D57;
--line:#E3DFD3; --indigo:#3B4D8C; --indigo-dark:#28345E; --indigo-soft:#EEF1F8;
--jade:#1F7A5C; --jade-soft:#E4F3EC; --amber:#C97F0E; --amber-soft:#FBF0E1; --radius:12px;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.7;}
.wrap{max-width:760px; margin:0 auto; padding:0 1.5rem 5rem;}
header{padding:3.4rem 0 2.2rem; border-bottom:1px solid var(--line); margin-bottom:2.4rem;}
.eyebrow{font-size:13px; letter-spacing:.14em; color:var(--indigo); font-weight:700; text-transform:uppercase; margin-bottom:.9rem; display:flex; align-items:center; gap:10px;}
.eyebrow .dot{width:6px; height:6px; background:var(--indigo); border-radius:50%; display:inline-block;}
h1{font-family:'Noto Serif KR', serif; font-weight:700; font-size:34px; margin:0 0 .6rem; letter-spacing:-.01em;}
.subtitle{color:var(--ink-soft); font-size:15px;}
.units{display:flex; flex-direction:column; gap:16px;}
.unit-card{
background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
padding:1.4rem 1.5rem; text-decoration:none; color:var(--ink); display:block;
transition:border-color .15s ease, transform .15s ease;
}
.unit-card:hover{border-color:var(--indigo); transform:translateX(2px);}
.unit-card.disabled{opacity:.55; pointer-events:none;}
.unit-top{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
.unit-num{
font-family:'Noto Serif KR', serif; font-weight:700; font-size:14px; color:var(--indigo);
width:36px; height:36px; border-radius:50%; background:var(--indigo-soft);
display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.unit-card h2{font-family:'Noto Serif KR', serif; font-size:19px; margin:0; flex:1;}
.status{font-size:12px; color:var(--jade); background:var(--jade-soft); padding:3px 10px; border-radius:20px; flex-shrink:0;}
.status.soon{color:var(--ink-soft); background:#EFEDE6;}
.unit-desc{margin:0 0 8px; font-size:13.5px; color:var(--ink-soft);}
.unit-meta{font-size:12px; color:var(--indigo-dark);}
footer{max-width:760px; margin:0 auto; padding:1.5rem; text-align:center; color:var(--ink-soft); font-size:12.5px; border-top:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="eyebrow"><span class="dot"></span>화법과 언어 · 문법</div>
<h1>문법 학습지 모음</h1>
<div class="subtitle">교과서 대단원을 선택해서 학습을 시작하세요.</div>
</header>

<div class="units">
<a class="unit-card" href="unit1/index.html">
<div class="unit-top">
<div class="unit-num">Ⅰ</div>
<h2>우리말 톺아보기</h2>
<div class="status">바로가기</div>
</div>
<p class="unit-desc">품사와 문장 구조, 단어의 짜임과 의미 관계, 어휘와 문법 요소, 담화의 구조</p>
<div class="unit-meta">[12화언01-03] ~ [12화언01-06] · 17차시 · 4개 챕터</div>
</a>

<a class="unit-card" href="unit2/index.html">
<div class="unit-top">
<div class="unit-num">Ⅱ</div>
<h2>언어와 국어 생활</h2>
<div class="status">바로가기</div>
</div>
<p class="unit-desc">표준 발음으로 국어 생활하기, 언어의 특성과 국어 생활의 변화</p>
<div class="unit-meta">[12화언01-01] ~ [12화언01-02] · 13차시 · 2개 챕터</div>
</a>
</div>
</div>
<footer>화법과 언어 · 문법 학습지</footer>
</body>
</html>
